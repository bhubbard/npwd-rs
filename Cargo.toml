[package]
name = "npwd-rs"
version = "0.1.0"
edition = "2024"
authors = ["Brandon Hubbard <bhubbard@users.noreply.github.com>"]
description = "Pure Rust simulated in-game smartphone architecture, OS state machine, apps, and game-world event bridge from NPWD"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bhubbard/npwd-rs"
keywords = ["phone", "fivem", "npwd", "simulation", "game-dev"]
categories = ["game-development", "simulation", "data-structures"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
